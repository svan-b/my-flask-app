<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketMultiply - Coming Soon</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/coming_soon.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cookieConsent.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<body>
    <div class="background-image"></div>
    <div class="container">
        <div class="content">
            <h1>MarketMultiply</h1>
            <h2>Coming Soon!</h2>
            <p>We are working on an exciting new wealth management tool. Tell us what features you would like to see.</p>
            <form id="emailForm">
                <div class="form-group">
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <button type="button" class="btn btn-primary" onclick="startSurvey()">Submit</button>
            </form>
            <div id="survey" class="hidden">
                <form id="surveyForm">
                    <div id="question1" class="form-group hidden">
                        <label for="feature">What feature would you like to see?</label>
                        <textarea id="feature" class="form-control" required></textarea>
                    </div>
                    <div id="question2" class="form-group hidden">
                        <label for="topics">What investment topics are you interested in?</label>
                        <textarea id="topics" class="form-control" required></textarea>
                    </div>
                    <div id="question3" class="form-group hidden">
                        <label for="comments">Any other comments or suggestions?</label>
                        <textarea id="comments" class="form-control" required></textarea>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="nextQuestion()">Next</button>
                    <button type="submit" class="btn btn-primary hidden" id="submitSurvey">Submit</button>
                </form>
            </div>
        </div>
    </div>
