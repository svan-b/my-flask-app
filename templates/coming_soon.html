<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketMultiply - Coming Soon</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/coming_soon.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cookieConsent.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>MarketMultiply</h1>
            <h2>Coming Soon!</h2>
            <p>We are working on an exciting new wealth management tool. Tell us what features you would like to see.</p>
            <form id="emailForm">
                <div class="form-group">
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <button type="button" class="btn btn-primary" onclick="startSurvey()">Submit</button>
            </form>
            <div id="survey" class="hidden">
                <form id="surveyForm">
                    <div id="question1" class="form-group hidden">
                        <label for="feature">What feature would you like to see?</label>
                        <textarea id="feature" class="form-control" required></textarea>
                    </div>
                    <div id="question2" class="form-group hidden">
                        <label for="topics">What investment topics are you interested in?</label>
                        <textarea id="topics" class="form-control" required></textarea>
                    </div>
                    <div id="question3" class="form-group hidden">
                        <label for="comments">Any other comments or suggestions?</label>
                        <textarea id="comments" class="form-control" required></textarea>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="nextQuestion()">Next</button>
                    <button type="submit" class="btn btn-primary hidden" id="submitSurvey">Submit</button>
                </form>
            </div>
        </div>
    </div>

    <div id="cookieConsent">
        This website uses cookies to ensure you get the best experience. 
        <button id="acceptCookies">Accept</button>
        <button id="declineCookies">Decline</button>
    </div>

    <script src="{{ url_for('static', filename='js/cookieConsent.js') }}"></script>
    <script>
        let currentQuestion = 1;

        function startSurvey() {
            document.getElementById('emailForm').classList.add('hidden');
            document.getElementById('survey').classList.remove('hidden');
            document.getElementById('question1').classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentQuestion < 3) {
                document.getElementById('question' + currentQuestion).classList.add('hidden');
                currentQuestion++;
                document.getElementById('question' + currentQuestion).classList.remove('hidden');
            } else {
                document.getElementById('submitSurvey').classList.remove('hidden');
            }
        }

        document.getElementById('surveyForm').onsubmit = function(event) {
            event.preventDefault();
            // Add your Mailchimp or other survey tool integration here.
            alert('Survey submitted! Thank you for your feedback.');
        }
    </script>
</body>
</html>
